name: Build CUAV-X7 firmware

on:
  workflow_dispatch:
    inputs:
      vehicle:
        description: 'Which vehicle to build'
        required: true
        default: 'copter'
        type: choice
        options:
          - copter
          - plane
          - rover
          - sub

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix git safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Configure
        run: ./waf configure --board CUAV-X7

      - name: Build bootloader
        run: |
          ./waf configure --board CUAV-X7 --bootloader
          ./waf bootloader

      - name: Build firmware
        run: |
          ./waf configure --board CUAV-X7
          ./waf ${{ inputs.vehicle }}

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/CUAV-X7/bin/* out/ 2>/dev/null || true
          ls -la out/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: CUAV-X7-${{ inputs.vehicle }}-firmware
          path: out/
          retention-days: 30
